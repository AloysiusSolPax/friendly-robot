<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Manager App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
        }
        h2 {
            color: #2e7d32;
        }
        input[type="password"] {
            padding: 8px;
            width: 300px;
            margin-right: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1b5e20;
        }
        #apiKeyStatus {
            margin-top: 8px;
            color: #555;
        }
    </style>
</head>
<body>
    <script src="farm_manager_app.js"></script>
</body>
</html>
